name: Heavy Double-T candidate compilation
on:
  pull_request:
    paths:
      - 'docs/candidates/heavy-double-t-mk3-mk31/**'
      - 'build.gradle'
      - '.github/workflows/heavy-double-t-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Check generated assets and static tests
        working-directory: docs/candidates/heavy-double-t-mk3-mk31/review
        run: |
          python3 tools/models/generate_heavy_double_t.py --check
          python3 -m unittest discover -s tests -v
      - name: Compile actual candidate Java against NeoForge
        run: bash gradlew compileHeavyDoubleTCandidateJava jar --stacktrace
      - name: Verify four candidate classes compiled and excluded from normal JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          names = ['HeavyDoubleTOrientation', 'HeavyDoubleTSupportBlock', 'HeavyDoubleTTopology', 'HeavyDoubleTConnectedModels']
          root = Path('build/classes/java/heavyDoubleTCandidate')
          for name in names:
              assert list(root.rglob(name + '.class')), 'Candidate class missing: ' + name
          jars = list(Path('build/libs').glob('*.jar'))
          assert jars, 'No normal JAR produced'
          for jar in jars:
              with ZipFile(jar) as z:
                  assert not any(any(name in entry for name in names) for entry in z.namelist()), 'Candidate leaked into normal JAR'
          PY
