name: GUI album three missing machines
on:
  push:
    branches: [dot/gui-album-three-20261115]
    paths: ['src/guiAlbumThree/**', 'tools/validation/*gui_album_three*', '.github/workflows/gui-album-three.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Prepare isolated native display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libx11-6 libxtst6 libgl1-mesa-dri
      - name: Validate capture proof guards
        run: python -m unittest discover -s tools/validation -p 'test_gui_album_three.py' -v
      - name: Capture three ordinary machine containers
        run: python tools/validation/gui_album_three.py --expected-jar-sha256 46970958a7510d22fe88c8e21ea1390adfc5ca6fcc052419c5b478854053464a
      - name: Retain native screenshots and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-album-three-${{ github.sha }}
          path: build/gui-album-three-native-*/
          if-no-files-found: error
          retention-days: 14
