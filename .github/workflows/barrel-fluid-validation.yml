name: Barrel legacy native fluid matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fluid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fluid: [water, lava, milk]
        locale:
          - {language: en_us, height: 720}
          - {language: fr_fr, height: 260}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run evidence-gate regressions
        run: python -m unittest discover -s tools/validation -p test_client_gameplay.py -v
      - name: Capture actual Barrel fluid in isolated Minecraft
        env:
          IEDCTR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x ./gradlew
          python tools/validation/client_gameplay.py --corrected-machine-gui-only --machine-gui-language ${{ matrix.locale.language }} --machine-gui-window-height ${{ matrix.locale.height }} --barrel-fluid ${{ matrix.fluid }} --prepare-timeout 600 --timeout 600
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: barrel-${{ matrix.fluid }}-${{ matrix.locale.language }}-native
          path: |
            build/client-gameplay-*/run/client-corrected-machine-gui-result.json
            build/client-gameplay-*/run/client-gameplay-result.json
            build/client-gameplay-*/run/corrected-machine-gui-screenshots/fluid_barrel-*.png
            build/client-gameplay-*/prepare.log
            build/client-gameplay-*/client.log
            build/client-gameplay-*/*.observed.log
          retention-days: 14
