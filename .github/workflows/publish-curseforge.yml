name: Publish CurseForge
run-name: "CurseForge ${{ 'v1.1.58-reconstructed' }} :: ${{ false && 'dry-run' || ('9153502' != '' && 'resume' || 'publish') }}"

on:
  # Routing tests validate this fixed branch/manifest contract before upload.
  # One explicitly authorized publication of the pinned 1.1.58 candidate, without a merge.
  push:
    branches: [dot/publish-curseforge-1.1.58]
    paths:
      - '.github/workflows/publish-curseforge.yml'
      - 'tools/release/curseforge_release_1.1.58.json'
      - 'release-bundle/1.1.58-reconstructed/curseforge-notes.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-${{ 'v1.1.58-reconstructed' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Guarded CurseForge publication
    if: github.event_name == 'push' && github.ref == 'refs/heads/dot/publish-curseforge-1.1.58' && github.repository == 'emmanueltremblay9-stack/Immersive-Engineer-Decor-Controls-Tool-Reforged'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      MANIFEST_PATH: ${{ 'tools/release/curseforge_release_1.1.58.json' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Initialize separate ephemeral report paths
        shell: bash
        run: |
          echo "PREPARE_REPORT_PATH=$RUNNER_TEMP/curseforge-upload-intent.json" >> "$GITHUB_ENV"
          echo "RESULT_REPORT_PATH=$RUNNER_TEMP/curseforge-publication-result.json" >> "$GITHUB_ENV"

      - name: Test publisher failure and idempotency paths
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Require reviewed local source and exact successful Build CI
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ 'v1.1.58-reconstructed' }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from publish_curseforge import Publisher, load_manifest, safe_repo_path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest_path = safe_repo_path(root, os.environ["MANIFEST_PATH"])
          manifest_path.relative_to(root / "tools/release")
          manifest = load_manifest(manifest_path)
          publisher = Publisher(root, manifest, require_local_source=True)
          repository = manifest["repository"]
          if f"{repository['owner']}/{repository['name']}" != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Manifest repository differs from this workflow repository")
          if manifest["release"]["tag"] != os.environ["REQUESTED_TAG"]:
              raise SystemExit("Requested publication label differs from the reviewed manifest")
          publisher.validate_build_ci(os.environ["GITHUB_TOKEN"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"commit={manifest['source']['commit']}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"LOCAL_JAR_PATH={root / 'runtime-source/build/libs' / manifest['release']['assetName']}\n")
          PY

      - name: Checkout exact runtime source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: runtime-source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle without persisting runtime outputs
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build private runtime JAR at the pinned commit
        shell: bash
        working-directory: runtime-source
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          bash ./gradlew clean build --no-build-cache --stacktrace
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$LOCAL_JAR_PATH"

      - name: Validate public inputs without a CurseForge secret
        id: dry-run
        if: ${{ false }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ 'v1.1.58-reconstructed' }}
        run: |
          set +e
          python tools/release/publish_curseforge.py \
            --dry-run \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --require-local-source \
            --source-root "$GITHUB_WORKSPACE/runtime-source" \
            --local-jar "$LOCAL_JAR_PATH" \
            --tag "$REQUESTED_TAG" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare exact upload intent without posting
        id: prepare
        if: ${{ !false && '9153502' == '' }}
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ 'v1.1.58-reconstructed' }}
        run: |
          python tools/release/publish_curseforge.py \
            --prepare-publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --require-local-source \
            --source-root "$GITHUB_WORKSPACE/runtime-source" \
            --local-jar "$LOCAL_JAR_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --report "$PREPARE_REPORT_PATH"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          prepare_path = Path(os.environ["PREPARE_REPORT_PATH"])
          report = json.loads(prepare_path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              if report.get("status") == "UPLOAD_INTENT_READY" and report.get("postRequired") is True:
                  safe_tag = re.sub(r"[^A-Za-z0-9_.-]", "-", report["tag"])
                  artifact_name = (
                      f"iedct-cf-{safe_tag}--{report['runKey']}--intent--"
                      f"{report['multipartSha256'][:12]}"
                  )
                  stream.write("post_required=true\n")
                  stream.write(f"artifact_name={artifact_name}\n")
              elif report.get("status") in {
                  "ALREADY_PUBLISHED",
                  "RESUMED_PUBLICATION_VERIFIED",
              } and report.get("postRequired") is False:
                  prepare_path.replace(Path(os.environ["RESULT_REPORT_PATH"]))
                  stream.write("post_required=false\n")
              else:
                  raise SystemExit("publisher returned an unsupported prepare state")
          PY

      - name: Persist upload intent before any POST
        id: persist-intent
        if: ${{ !false && '9153502' == '' && steps.prepare.outputs.post_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ env.PREPARE_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Submit exact persisted request once
        id: publish
        if: ${{ !false && '9153502' == '' && steps.prepare.outputs.post_required == 'true' && steps.persist-intent.outcome == 'success' }}
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_ID: ${{ steps.persist-intent.outputs.artifact-id }}
          REQUESTED_TAG: ${{ 'v1.1.58-reconstructed' }}
        run: |
          set +e
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --require-local-source \
            --source-root "$GITHUB_WORKSPACE/runtime-source" \
            --local-jar "$LOCAL_JAR_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --intent-report "$PREPARE_REPORT_PATH" \
            --intent-artifact-id "$INTENT_ARTIFACT_ID" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resume an accepted file without a token or second POST
        id: resume
        if: ${{ !false && '9153502' != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ 'v1.1.58-reconstructed' }}
          RESUME_FILE_ID: ${{ '9153502' }}
        run: |
          [[ "$RESUME_FILE_ID" =~ ^[1-9][0-9]*$ ]]
          set +e
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --require-local-source \
            --source-root "$GITHUB_WORKSPACE/runtime-source" \
            --local-jar "$LOCAL_JAR_PATH" \
            --tag "$REQUESTED_TAG" \
            --resume-file-id "$RESUME_FILE_ID" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare sanitized result artifact metadata
        id: result-metadata
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report_path = Path(os.environ["RESULT_REPORT_PATH"])
          if not report_path.is_file():
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          status = str(report.get("status", "REPORT_INVALID"))
          if status == "UPLOAD_INTENT_READY":
              raise SystemExit("an upload intent cannot be persisted as a publication result")
          if not re.fullmatch(r"[A-Z0-9_]+", status):
              status = "REPORT_INVALID"
          file_id = report.get("fileId", 0)
          if not isinstance(file_id, int) or file_id < 0:
              file_id = 0
          safe_tag = re.sub(r"[^A-Za-z0-9_.-]", "-", str(report.get("tag", "unknown")))
          artifact_name = (
              f"iedct-cf-{safe_tag}--{os.environ['RUN_KEY']}--result--{status}--{file_id}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={artifact_name}\n")
          PY

      - name: Persist sanitized publication result
        if: ${{ always() && steps.result-metadata.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.result-metadata.outputs.artifact_name }}
          path: ${{ env.RESULT_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Record sanitized publication verdict
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_REPORT_PATH"])
          prepare_path = Path(os.environ["PREPARE_REPORT_PATH"])
          report_path = result_path if result_path.is_file() else prepare_path
          if not report_path.is_file():
              summary = {"status": "REPORT_NOT_PRODUCED", "verdict": "FAIL"}
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              summary = {
                  key: report.get(key)
                  for key in (
                      "status",
                      "verdict",
                      "fileId",
                      "publicHashMatch",
                      "publicSha256",
                      "exitCode",
                  )
                  if key in report
              }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("### CurseForge publication\n\n")
              stream.write("```json\n")
              stream.write(json.dumps(summary, indent=2, sort_keys=True))
              stream.write("\n```\n")
          PY
