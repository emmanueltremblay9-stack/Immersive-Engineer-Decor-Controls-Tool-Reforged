name: Factory Placer packaged qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify retained artwork and clean exact checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'ff079488dd0d1c7434597a6915231d88b81732472bb23ccc8a61235eca27ec2b  src/main/resources/assets/immersive_engineer_decor_controls_tool_reforged/textures/gui/factory_placer_v2_reference/background.png' | sha256sum --check
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile, run JUnit and existing GameTests, build JAR
        shell: bash
        run: |
          bash ./gradlew compileJava processResources test runGameTestServer jar --stacktrace
          for artifact in build/libs/*.jar; do
            jar tf "$artifact" > build/default-jar-entries.txt
            if grep -q 'NativeFactoryPlacer' build/default-jar-entries.txt; then
              echo 'Default JAR contains opt-in native fixture' >&2
              exit 1
            fi
          done
          git rev-parse HEAD > build/tested-source-sha.txt
          find build/libs -maxdepth 1 -name '*.jar' -exec sha256sum {} + > build/tested-jar-sha256.txt
          (cd build && sha256sum libs/*.jar > shared-runtime-sha256.txt)
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Compile isolated harness and verify packaged classpath
        run: bash ./gradlew -Pinclude_factory_placer_native_validation=true verifyFactoryPlacerPackagedRuntime --stacktrace
      - name: Test native evidence validator
        run: python -m unittest discover -s tools/validation -p 'test_factory_placer*.py' -v
      - name: Retain the one normal runtime JAR for all native profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-placer-shared-runtime
          path: |
            build/libs/*.jar
            build/tested-source-sha.txt
            build/shared-runtime-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: State evidence boundaries
        if: always()
        shell: bash
        run: |
          echo "Tested checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native runs use the same normal JAR with a separate test harness. V2 is the normal client GUI; every profile runs without the former development presentation property. No release or owner visual acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Required native checklist: docs/testing/factory-placer-v2-reference/NATIVE_VALIDATION.md' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-placer-v2-reference-experiment-reports
          path: |
            build/tested-source-sha.txt
            build/tested-jar-sha256.txt
            build/libs/*.jar
            build/default-jar-entries.txt
            build/reports/tests/
            build/test-results/
          retention-days: 14

  validate-native-scale:
    needs: validate-experiment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: en-1280x720-scale1
            language: en_us
            width: 1280
            height: 720
            gui_scale: 1
          - profile: fr-1280x260-scale1
            language: fr_fr
            width: 1280
            height: 260
            gui_scale: 1
          - profile: en-1920x1080-scale1
            language: en_us
            width: 1920
            height: 1080
            gui_scale: 1
          - profile: en-1920x1080-scale2
            language: en_us
            width: 1920
            height: 1080
            gui_scale: 2
          - profile: en-1920x1080-scale3
            language: en_us
            width: 1920
            height: 1080
            gui_scale: 3
          - profile: fr-1920x1080-scale3
            language: fr_fr
            width: 1920
            height: 1080
            gui_scale: 3
          - profile: fr-ca-1920x1080-scale3
            language: fr_ca
            width: 1920
            height: 1080
            gui_scale: 3
          - profile: default-en-1280x720-scale1
            presentation: default
            language: en_us
            width: 1280
            height: 720
            gui_scale: 1
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check native display prerequisites
        run: command -v Xvfb && command -v xvfb-run && command -v xauth
      - name: Download exact normal runtime JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, official actions release
        with:
          name: factory-placer-shared-runtime
          path: build/packaged-input
      - name: Record exact source identity
        run: |
          mkdir -p build
          git rev-parse HEAD > build/tested-source-sha.txt
          test "$(cat build/packaged-input/tested-source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd build/packaged-input && sha256sum --check shared-runtime-sha256.txt)
          git status --porcelain --untracked-files=all
      - name: Capture native interactions at requested GUI scale
        shell: bash
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          python tools/validation/factory_placer_v2_reference_native.py \
            --presentation '${{ matrix.presentation || 'v2' }}' \
            --runtime-jar "build/packaged-input/libs/${mod_id}-${mod_version}.jar" \
            --language ${{ matrix.language }} --width ${{ matrix.width }} --height ${{ matrix.height }} \
            --gui-scale ${{ matrix.gui_scale }} --prepare-timeout 900 --timeout 900
      - name: State native evidence boundaries
        if: always()
        run: |
          echo "Tested checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Requested profile: ${{ matrix.profile }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Proof must match the shared JAR, actual class/resource origins, requested viewport and native pixels. Clicks/drags use screen handlers; XTest verifies modifiers and hover. Full owner visual acceptance is not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-placer-v2-reference-native-${{ matrix.profile }}
          path: |
            build/tested-source-sha.txt
            build/factory-placer-v2-reference-native-*/run/client-factory-placer-v2-reference-result.json
            build/factory-placer-v2-reference-native-*/run/client-factory-placer-packaged-default-result.json
            build/factory-placer-v2-reference-native-*/run/factory-placer-packaged-default.png
            build/factory-placer-v2-reference-native-*/run/factory-placer-v2-reference-screenshots/*.png
            build/factory-placer-v2-reference-native-*/packaged-runtime-classpath.json
            build/factory-placer-v2-reference-native-*/runtime-jar-sha256.txt
            build/factory-placer-v2-reference-native-*/package.log
            build/factory-placer-v2-reference-native-*/prepare.log
            build/factory-placer-v2-reference-native-*/client.log
            build/factory-placer-v2-reference-native-*/*.observed.log
          retention-days: 14
