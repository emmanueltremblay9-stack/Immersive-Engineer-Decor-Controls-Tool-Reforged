name: Factory Study V3 native qualification

on:
  pull_request:
    paths:
      - ".github/workflows/factory-control-tooltips.yml"
      - "build.gradle"
      - "gradle/factory-study-packaged-validation.gradle"
      - "src/factoryPlacerNativeValidation/java/com/oblixorprime/iedctrtest/factoryplacer/FactoryStudy*.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/client/ClientModEvents.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/client/FactoryStudyScreen.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/compat/jei/EngineersDecorJeiPlugin.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/compat/jei/FactoryStudyJeiHandler.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/menu/MachineMenu.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/utility/FactoryStudyGeometry.java"
      - "src/main/java/com/oblixorprime/engineersdecorreforged/utility/FactoryStudyState.java"
      - "src/main/resources/assets/immersive_engineer_decor_controls_tool_reforged/lang/**"
      - "src/main/resources/assets/immersive_engineer_decor_controls_tool_reforged/textures/gui/factory_study_v3/**"
      - "src/test/java/com/oblixorprime/engineersdecorreforged/compat/jei/FactoryStudyJeiHandlerTest.java"
      - "src/test/java/com/oblixorprime/engineersdecorreforged/utility/FactoryStudy*Test.java"
      - "tools/validation/factory_study_native.py"

permissions:
  contents: read

jobs:
  factory-study-native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Check harness syntax
        run: python -m py_compile tools/validation/factory_study_native.py
      - name: Open exact packaged JAR in two cold Minecraft sessions
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tools/validation/factory_study_native.py
