name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Gradle validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test guarded CurseForge publisher
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        shell: bash
        run: chmod +x ./gradlew

      - name: Compile Java and process resources
        shell: bash
        run: ./gradlew compileJava processResources --stacktrace

      - name: Run tests
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Run dedicated GameTests
        shell: bash
        run: ./gradlew runGameTestServer --stacktrace

      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace

      - name: Read release coordinates
        shell: bash
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$mod_id"
          test -n "$mod_version"
          echo "MOD_ID=$mod_id" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"

      - name: Record runtime JAR SHA-256
        id: runtime-jar
        shell: bash
        run: |
          jar="build/libs/${MOD_ID}-${MOD_VERSION}.jar"
          test -f "$jar"
          runtime_sha256="$(sha256sum "$jar" | awk '{print $1}')"
          test "${#runtime_sha256}" -eq 64
          echo "sha256=$runtime_sha256" >> "$GITHUB_OUTPUT"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Runtime JAR SHA-256: $runtime_sha256"

      - name: Upload runtime jar
        id: upload-runtime-jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.MOD_ID }}-${{ env.MOD_VERSION }}
          path: build/libs/${{ env.MOD_ID }}-${{ env.MOD_VERSION }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Record runtime and Actions archive digests
        shell: bash
        env:
          ACTIONS_ARCHIVE_DIGEST: ${{ steps.upload-runtime-jar.outputs.artifact-digest }}
          RUNTIME_JAR_SHA256: ${{ steps.runtime-jar.outputs.sha256 }}
        run: |
          test -n "$ACTIONS_ARCHIVE_DIGEST"
          test -n "$RUNTIME_JAR_SHA256"
          echo "Runtime JAR SHA-256: $RUNTIME_JAR_SHA256"
          echo "Actions archive digest: $ACTIONS_ARCHIVE_DIGEST"
          echo "### Uploaded artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime JAR SHA-256: \`$RUNTIME_JAR_SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Actions archive digest: \`$ACTIONS_ARCHIVE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
