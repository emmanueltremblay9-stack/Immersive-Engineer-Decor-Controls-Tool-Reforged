name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Gradle validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test guarded CurseForge publisher
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        shell: bash
        run: chmod +x ./gradlew

      - name: Compile Java and process resources
        shell: bash
        run: ./gradlew compileJava processResources --stacktrace

      - name: Run tests
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Run dedicated GameTests
        shell: bash
        run: ./gradlew runGameTestServer --stacktrace

      - name: Test client validation evidence gates
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tools/validation -p 'test_*.py' -v

      - name: Verify client Mixin transformation and class loading
        timeout-minutes: 15
        shell: bash
        run: python tools/validation/client_mixin_smoke.py --prepare-timeout 600 --timeout 180

      - name: Verify native client lamp mining and server acknowledgement
        timeout-minutes: 30
        shell: bash
        run: python tools/validation/client_gameplay.py --prepare-timeout 600 --timeout 1080

      - name: Retain synthetic canal scene evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, already used by this repository
        with:
          name: water-canal-scenes
          path: |
            build/client-gameplay-*/run/canal-screenshots/*.png
            build/client-gameplay-*/run/client-water-canal-result.json
            build/client-gameplay-*/run/client-water-flow-distance-result.json
            build/client-gameplay-*/run/catalogue-screenshots/*.png
            build/client-gameplay-*/run/client-catalogue-result.json
            build/client-gameplay-*/run/client-generic-fluid-result.json
            build/client-gameplay-*/run/client-submerged-catwalk-result.json
            build/client-gameplay-*/run/submerged-catwalk-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace

      - name: Read release coordinates
        shell: bash
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$mod_id"
          test -n "$mod_version"
          echo "MOD_ID=$mod_id" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"

      - name: Record runtime JAR SHA-256
        shell: bash
        run: |
          jar="build/libs/${MOD_ID}-${MOD_VERSION}.jar"
          test -f "$jar"
          runtime_sha256="$(sha256sum "$jar" | awk '{print $1}')"
          test "${#runtime_sha256}" -eq 64
          echo "Runtime JAR SHA-256: $runtime_sha256"
          echo "### Local runtime build (not uploaded)" >> "$GITHUB_STEP_SUMMARY"
          echo "JAR: \`$jar\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$runtime_sha256\`" >> "$GITHUB_STEP_SUMMARY"

  renderer-matrix:
    name: East canal renderer (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [native, embeddium, modernfix, both]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run isolated flow, generic fluid and submerged support profile
        timeout-minutes: 20
        shell: bash
        run: |
          chmod +x ./gradlew
          python tools/validation/client_gameplay.py --renderer-profile ${{ matrix.profile }} --flow-distance-only --prepare-timeout 600 --timeout 420
      - name: Retain synthetic renderer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-${{ matrix.profile }}
          path: |
            build/client-gameplay-*/run/canal-screenshots/*.png
            build/client-gameplay-*/run/client-water-canal-result.json
            build/client-gameplay-*/run/client-water-flow-distance-result.json
            build/client-gameplay-*/run/catalogue-screenshots/*.png
            build/client-gameplay-*/run/client-catalogue-result.json
            build/client-gameplay-*/run/client-generic-fluid-result.json
            build/client-gameplay-*/run/client-submerged-catwalk-result.json
            build/client-gameplay-*/run/submerged-catwalk-screenshots/*.png
          if-no-files-found: error
          retention-days: 14


  lava-surfaces:
    name: Lava surface continuity (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [native, embeddium]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Verify lava surface heights and capture isolated scenes
        timeout-minutes: 25
        shell: bash
        run: |
          chmod +x ./gradlew
          python tools/validation/client_gameplay.py --renderer-profile ${{ matrix.profile }} --lava-surface-only --prepare-timeout 600 --timeout 600
      - name: Retain synthetic lava evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lava-${{ matrix.profile }}
          path: |
            build/client-gameplay-*/run/client-lava-surface-result.json
            build/client-gameplay-*/run/lava-surface-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
