plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def tfcMilkingRuntime = providers.gradleProperty('include_tfc_milking_runtime').map { it.toBoolean() }.getOrElse(false)
def tfcCrossoverRuntime = providers.gradleProperty('include_tfc_crossover_runtime').map { it.toBoolean() }.getOrElse(false)
// Dedicated native GUI proof code is not part of main or any distributed JAR.
def factoryPlacerNativeValidation = providers.gradleProperty('include_factory_placer_native_validation').map { it.toBoolean() }.getOrElse(false)
def factoryPlacerRuntimeJar = providers.gradleProperty('factory_placer_runtime_jar').map { file(it) }
        .orElse(tasks.named('jar', Jar).flatMap { it.archiveFile }.map { it.asFile })
if (factoryPlacerNativeValidation) {
    sourceSets.create('factoryPlacerNativeValidation') {
        java.srcDir('src/factoryPlacerNativeValidation/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // Production classes/resources must be discovered from the exact normal JAR.
        runtimeClasspath = output + configurations.getByName(runtimeClasspathConfigurationName) +
                (sourceSets.main.runtimeClasspath - sourceSets.main.output) +
                files(factoryPlacerRuntimeJar)
    }
}
if (tfcCrossoverRuntime && !tfcMilkingRuntime) throw new GradleException('Crossover test profile requires include_tfc_milking_runtime=true')
configurations { tfcMilkingApi; tfcMilkingCrossover }
if (tfcMilkingRuntime) sourceSets.main.java.srcDir('src/tfcGameTest/java')

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

neoForge {
    // Official TFC 4.2.12 metadata requires >=21.1.234; default runtime stays unchanged.
    version = tfcMilkingRuntime ? '21.1.234' : project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Explicit development opt-in; not passed to server or GameTest runs.
            if (providers.gradleProperty('dev_freezer_v5_exact_reference').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'iedctr.dev.freezerV5ExactReference', 'true'
            }
            // Separate opt-in. Exact reference wins when both are set; neither affects production defaults.
            if (providers.gradleProperty('dev_freezer_v5_live_energy').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'iedctr.dev.freezerV5LiveEnergy', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', tfcMilkingRuntime ? "${project.mod_id}_tfc" : project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


// Opt-in, separate test mod; ordinary runs and the distributed JAR stay unchanged.
if (factoryPlacerNativeValidation) {
    def harness = sourceSets.factoryPlacerNativeValidation
    neoForge.mods.create('iedctr_factory_placer_validation') { sourceSet(harness) }
    neoForge.runs.configureEach { loadedMods = [neoForge.mods.getByName(project.mod_id)] }
    ['factoryPlacerPackagedClient', 'factoryPlacerPackagedDefaultClient'].each { runName ->
        neoForge.runs.create(runName) {
            client()
            sourceSet = harness
            loadedMods = [neoForge.mods.getByName('iedctr_factory_placer_validation')]
            disableIdeRun()
            taskBefore(tasks.named('jar'))
            taskBefore(tasks.named('factoryPlacerNativeValidationClasses'))
            // The verifier is registered below; no source-output fallback is permitted.
            if (runName == 'factoryPlacerPackagedDefaultClient') {
                systemProperty 'iedctr.factoryPlacerPackagedDefaultNative', 'true'
            }
        }
    }
    def verifyPackagedRuntime = tasks.register('verifyFactoryPlacerPackagedRuntime') {
        group = 'verification'
        dependsOn(tasks.named('jar'), tasks.named('factoryPlacerNativeValidationClasses'))
        doLast {
            def jarFile = factoryPlacerRuntimeJar.get().canonicalFile
            def normalJar = tasks.named('jar', Jar).get().archiveFile.get().asFile.canonicalFile
            def sha256 = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
            if (sha256(jarFile) != sha256(normalJar)) {
                throw new GradleException('Supplied runtime JAR differs from the normal JAR built from this exact source checkout')
            }
            def classpath = harness.runtimeClasspath.files.collect { it.canonicalFile }
            def mainOutputs = sourceSets.main.output.files.collect { it.canonicalFile }
            if (!classpath.contains(jarFile) || classpath.any { mainOutputs.contains(it) }) {
                throw new GradleException('Packaged validation requires the exact JAR and forbids main output on runtime classpath')
            }
            def harnessPackages = [] as Set
            harness.output.classesDirs.asFileTree.matching { include '**/*.class' }.files.each {
                def root = harness.output.classesDirs.files.find { dir -> it.toPath().startsWith(dir.toPath()) }
                def relative = root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
                harnessPackages.add(relative.contains('/') ? relative.substring(0, relative.lastIndexOf('/')) : '')
            }
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith('com/oblixorprime/iedctrtest/') || entry.name.contains('NativeFactoryPlacerV2ReferenceValidation')) {
                        throw new GradleException('Validation fixture leaked into production JAR')
                    }
                    if (entry.name.endsWith('.class') && entry.name.contains('/') &&
                            harnessPackages.contains(entry.name.substring(0, entry.name.lastIndexOf('/')))) {
                        throw new GradleException('Harness and production JAR contain a split package')
                    }
                }
            }
            ['factoryPlacerPackagedClient', 'factoryPlacerPackagedDefaultClient'].each { name ->
                def run = neoForge.runs.getByName(name)
                if (run.sourceSet.get() != harness || run.loadedMods.get()*.name != ['iedctr_factory_placer_validation']) {
                    throw new GradleException('Packaged validation must load only the separate harness development mod')
                }
            }
            def report = layout.buildDirectory.file('reports/factory-placer-packaged-runtime.json').get().asFile
            report.parentFile.mkdirs()
            report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    jar_path: jarFile.path,
                    jar_sha256: java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes).encodeHex().toString(),
                    runtime_classpath: classpath*.path, forbidden_main_outputs: mainOutputs*.path,
                    harness_outputs: harness.output.files.collect { it.canonicalPath },
                    loaded_development_mods: ['iedctr_factory_placer_validation'],
                    fixture_free_jar: true, split_packages: false]))
        }
    }
    ['factoryPlacerPackagedClient', 'factoryPlacerPackagedDefaultClient'].each { name ->
        neoForge.runs.getByName(name).taskBefore(verifyPackagedRuntime)
    }
}

dependencies {
    // Official release 4.2.12, fixed Modrinth version ID, never bundled or required at runtime.
    tfcMilkingApi('maven.modrinth:JaCEZUhg:2gXJo8Ol') { transitive = false }
    compileOnly files(configurations.tfcMilkingApi)
    if (tfcMilkingRuntime) {
        runtimeOnly files(configurations.tfcMilkingApi)
        runtimeOnly 'vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE'
    }
    if (tfcCrossoverRuntime) {
        tfcMilkingCrossover('maven.modrinth:IsYwQTKM:q5cvg8JU') { transitive = false }
        runtimeOnly files(configurations.tfcMilkingCrossover)
    }
    testImplementation "junit:junit:4.13.2"
    // Optional renderer API only; never bundled or installed by the runtime dependency graph.
    compileOnly "maven.modrinth:embeddium:J7b96IEd"
    implementation "blusunrize.immersiveengineering:ImmersiveEngineering:${immersive_engineering_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (providers.gradleProperty('include_jei_runtime').map { it.toBoolean() }.getOrElse(true)) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

tasks.register('verifyTfcMilkingDependencies') {
    inputs.files(configurations.tfcMilkingApi)
    if (tfcCrossoverRuntime) inputs.files(configurations.tfcMilkingCrossover)
    doLast {
        def verify = { configuration, expected ->
            def artifact = configuration.singleFile
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[65536]
                for (int count; (count = input.read(buffer)) != -1;) digest.update(buffer, 0, count)
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != expected) throw new GradleException("Unexpected compatibility artifact SHA-256: ${artifact.name}")
        }
        verify(configurations.tfcMilkingApi, '3c2d80e47c78cfbd617823ebe0d3d5e2f9ba9e7f04c1b34867dbab3894584440')
        if (tfcCrossoverRuntime) verify(configurations.tfcMilkingCrossover, '9c10394225be5e9cdab845cfb6192b88beb4cb6b21b66e3caeedf9c4982b486b')
    }
}
tasks.named('compileJava') { dependsOn('verifyTfcMilkingDependencies') }

// These ordinary JUnit tests inspect mapped Minecraft/Mixin bytecode as resources.
// ModDev attaches game libraries to main's classpaths, not testImplementation.
// Reuse those resolved inputs without enabling the NeoForge bootstrapped test engine.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.property('tfcMilkingRuntime', tfcMilkingRuntime)
    if (tfcMilkingRuntime) {
        from("src/main/resources/data/${project.mod_id}/structure/empty.nbt") {
            into("data/${project.mod_id}_tfc/structure")
        }
    }
}

tasks.register('validateSignItemModels') {
    group = 'verification'
    description = 'Validates that full-panel signs use centered flat item geometry without changing their world models.'
    inputs.files(
            "src/main/resources/assets/${mod_id}/models/item/sign_decor.json",
            "src/main/resources/assets/${mod_id}/models/item/sign_defense.json",
            "src/main/resources/assets/${mod_id}/models/block/sign/sign_decor_model.json",
            "src/main/resources/assets/${mod_id}/textures/block/sign/engineersdecor-logo.png",
            "src/main/resources/assets/${mod_id}/textures/block/sign/sign_defense_texture.png"
    )

    doLast {
        def json = new groovy.json.JsonSlurper()
        def expectedTextures = [
                sign_decor  : "${mod_id}:block/sign/engineersdecor-logo",
                sign_defense: "${mod_id}:block/sign/sign_defense_texture"
        ]
        def worldModel = json.parse(file("src/main/resources/assets/${mod_id}/models/block/sign/sign_decor_model.json"))
        def preservedContexts = ['thirdperson_righthand', 'firstperson_righthand', 'ground', 'fixed']
        def expectedHead = [
                rotation   : [0, 0, 0],
                translation: [0, 0, 0],
                scale      : [1, 1, 1]
        ]
        def expectedGui = [
                rotation   : [0, 0, 0],
                translation: [0, 0.5, 0],
                scale      : [1, 1, 1]
        ]
        def expectedContexts = (preservedContexts + ['head', 'gui']) as Set

        expectedTextures.each { String itemId, String expectedTexture ->
            def modelFile = file("src/main/resources/assets/${mod_id}/models/item/${itemId}.json")
            def model = json.parse(modelFile)
            if (model['parent'] != 'item/generated') {
                throw new GradleException("${itemId} must use item/generated instead of inheriting volumetric world geometry")
            }
            if (model['gui_light'] != 'front') {
                throw new GradleException("${itemId} must use flat GUI lighting")
            }
            if (model.containsKey('elements')) {
                throw new GradleException("${itemId} must let item/generated create centered item geometry")
            }
            if (!(model['textures'] instanceof Map) || model['textures']['layer0'] != expectedTexture) {
                throw new GradleException("${itemId} layer0 must be ${expectedTexture}")
            }
            if (!(model['display'] instanceof Map) || model['display'].keySet() != expectedContexts) {
                throw new GradleException("${itemId} must preserve the complete expected display-transform set")
            }
            preservedContexts.each { String context ->
                if (model['display'][context] != worldModel['display'][context]) {
                    throw new GradleException("${itemId} ${context} must match the established world-model item transform")
                }
            }
            if (model['display']['head'] != expectedHead) {
                throw new GradleException("${itemId} head must remain an identity transform")
            }
            if (model['display']['gui'] != expectedGui) {
                throw new GradleException("${itemId} gui must be an explicit identity rotation and scale with the established translation")
            }

            def texturePath = expectedTexture.split(':', 2)[1]
            def textureFile = file("src/main/resources/assets/${mod_id}/textures/${texturePath}.png")
            if (!textureFile.isFile()) {
                throw new GradleException("${itemId} layer0 texture is missing: ${textureFile}")
            }
        }

        logger.lifecycle('Validated flat GUI item models and preserved transforms for sign_decor and sign_defense')
    }
}

tasks.register('validateManualResources') {
    group = 'verification'
    description = 'Validates Engineer\'s Manual autoload parity, entry resources, and crafting-recipe type safety.'
    inputs.dir(layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/manual"))
    inputs.file(layout.projectDirectory.file('src/main/resources/assets/immersiveengineering/manual/autoload.json'))
    inputs.dir(layout.projectDirectory.dir("src/main/resources/data/${mod_id}/recipe"))

    doLast {
        def json = new groovy.json.JsonSlurper()
        def authoritativeAutoload = file('src/main/resources/assets/immersiveengineering/manual/autoload.json')
        def mirrorAutoload = file("src/main/resources/assets/${mod_id}/manual/autoload.json")
        def manualRoot = file("src/main/resources/assets/${mod_id}/manual")
        def recipeRoot = file("src/main/resources/data/${mod_id}/recipe")

        if (!authoritativeAutoload.isFile() || !mirrorAutoload.isFile()) {
            throw new GradleException('Both Engineer\'s Manual autoload files must exist')
        }
        if (!java.util.Arrays.equals(authoritativeAutoload.bytes, mirrorAutoload.bytes)) {
            throw new GradleException('Engineer\'s Manual autoload files have drifted apart')
        }

        def sources = []
        Closure collectSources
        collectSources = { Object value ->
            if (value instanceof Map) {
                if (value['source'] instanceof String) {
                    sources.add(value['source'])
                }
                value.values().each { collectSources(it) }
            } else if (value instanceof Collection) {
                value.each { collectSources(it) }
            }
        }
        collectSources(json.parse(authoritativeAutoload))
        if (sources.toSet().size() != sources.size()) {
            throw new GradleException('Engineer\'s Manual autoload contains duplicate source entries')
        }

        sources.each { String source ->
            def parts = source.split(':', 2)
            if (parts.length != 2 || parts[0] != mod_id) {
                throw new GradleException("Manual source must be qualified with ${mod_id}: ${source}")
            }
            def entryJson = new File(manualRoot, "${parts[1]}.json")
            def entryText = new File(new File(manualRoot, 'en_us'), "${parts[1]}.txt")
            if (!entryJson.isFile() || !entryText.isFile()) {
                throw new GradleException("Manual source is incomplete: ${source}")
            }
        }

        int namedCraftingReferences = 0
        Closure validateWidgets
        validateWidgets = { Object value, File entryFile ->
            if (value instanceof Map) {
                if (value['type'] == 'crafting') {
                    if (!(value['recipe'] instanceof String) || value['recipe'].trim().isEmpty()) {
                        throw new GradleException("Crafting widget has no valid recipe id in ${entryFile}")
                    }
                    namedCraftingReferences++
                    String recipeId = value['recipe']
                    def parts = recipeId.split(':', 2)
                    if (parts.length != 2) {
                        throw new GradleException("Unqualified crafting recipe in ${entryFile}: ${recipeId}")
                    }
                    if (parts[0] == mod_id) {
                        def recipeFile = new File(recipeRoot, "${parts[1]}.json")
                        if (!recipeFile.isFile()) {
                            throw new GradleException("Manual crafting recipe is missing in ${entryFile}: ${recipeId}")
                        }
                        def recipeType = json.parse(recipeFile)['type']
                        boolean isVanillaCraftingRecipe = recipeType instanceof String && recipeType.startsWith('minecraft:crafting_')
                        // The labeled-crate upgrade is a registered CraftingRecipe serializer that must copy the input inventory safely.
                        boolean isSafeLabeledCrateUpgrade = recipeId == "${mod_id}:labeled_crate" && recipeType == "${mod_id}:labeled_crate_upgrade"
                        if (!isVanillaCraftingRecipe && !isSafeLabeledCrateUpgrade) {
                            throw new GradleException("Manual crafting widget points at non-crafting recipe ${recipeId} (${recipeType}) in ${entryFile}")
                        }
                    }
                }
                value.values().each { validateWidgets(it, entryFile) }
            } else if (value instanceof Collection) {
                value.each { validateWidgets(it, entryFile) }
            }
        }
        fileTree(manualRoot) {
            include '**/*.json'
            exclude 'autoload.json'
        }.files.sort().each { File entryFile -> validateWidgets(json.parse(entryFile), entryFile) }

        logger.lifecycle("Validated ${sources.size()} Engineer's Manual sources and ${namedCraftingReferences} named crafting widgets")
    }
}

tasks.register('validateProjectMetadata') {
    group = 'verification'
    description = 'Validates release version, attribution, support links, and issue-reporting metadata.'
    inputs.files(
            'LICENSE', 'NOTICE.md', 'CREDITS.md', 'README.md', 'README_RECONSTRUCTION.md', 'CHANGELOG.md',
            'src/main/resources/META-INF/LICENSE', 'src/main/resources/META-INF/NOTICE.md',
            'src/main/resources/META-INF/CREDITS.md', 'src/main/resources/META-INF/neoforge.mods.toml',
            '.github/ISSUE_TEMPLATE/bug_report.yml', '.github/ISSUE_TEMPLATE/config.yml'
    )

    doLast {
        [
                'LICENSE'   : 'src/main/resources/META-INF/LICENSE',
                'NOTICE.md' : 'src/main/resources/META-INF/NOTICE.md',
                'CREDITS.md': 'src/main/resources/META-INF/CREDITS.md'
        ].each { String rootPath, String packagedPath ->
            def rootFile = file(rootPath)
            def packagedFile = file(packagedPath)
            if (!rootFile.isFile() || !packagedFile.isFile() || !java.util.Arrays.equals(rootFile.bytes, packagedFile.bytes)) {
                throw new GradleException("Root and packaged attribution must match: ${rootPath}")
            }
        }

        def issueUrl = 'https://github.com/emmanueltremblay9-stack/Immersive-Engineer-Decor-Controls-Tool-Reforged/issues'
        def repositoryUrl = 'https://github.com/emmanueltremblay9-stack/Immersive-Engineer-Decor-Controls-Tool-Reforged'
        def readme = file('README.md').getText('UTF-8')
        def toml = file('src/main/resources/META-INF/neoforge.mods.toml').getText('UTF-8')
        if (!readme.contains('## Bug reports') || !readme.contains(issueUrl)) {
            throw new GradleException('README must expose this fork\'s GitHub issue-reporting surface')
        }
        if (!toml.contains("issueTrackerURL=\"${issueUrl}\"") || !toml.contains("displayURL=\"${repositoryUrl}\"")) {
            throw new GradleException('NeoForge metadata must expose repository and issue URLs')
        }
        if (!file('.github/ISSUE_TEMPLATE/bug_report.yml').isFile() || !file('.github/ISSUE_TEMPLATE/config.yml').isFile()) {
            throw new GradleException('GitHub issue templates are required')
        }

        def versionMatcher = toml =~ /(?m)^version="([^"]+)"$/
        if (!versionMatcher.find() || versionMatcher.group(1) != mod_version.toString()) {
            throw new GradleException("NeoForge version must match gradle.properties (${mod_version})")
        }
        if (!file('CHANGELOG.md').getText('UTF-8').contains("## [${mod_version}]")) {
            throw new GradleException("CHANGELOG.md must contain a ${mod_version} release heading")
        }
        if (!file('README_RECONSTRUCTION.md').getText('UTF-8').contains('422EDB90047C6B1E188BC204DAA2C926DB11DC07DE527B269377369871465DE7')) {
            throw new GradleException('Reconstruction provenance must retain the recovered base-artifact SHA-256')
        }

        logger.lifecycle("Validated attribution, support metadata, and release version ${mod_version}")
    }
}


// Pinned Engineer's Tools 1.1.6 assets; see docs/testing/engineers-tools-static-model-parity.md.
def restoredToolsItems = [
        diving_capsule: [model: 'd3676f8eaac86902ac05ef2dcc35e98ae7942a9c', texture: '696a1a80f756aecc264b46868eba80d87a85e653'],
        material_box: [model: 'a78dc81fc07325e96b49ca691bdbbef1592ee2e0', texture: '0c8446c4638ddca67fd62a6d5ebbd3677732c601'],
        musli_bar_press: [model: '07b544b9571a1f796fd7d03a8e65a57aec326382', texture: 'cd94fe28d72199df78e7d5fb9c7c3571e0093d78'],
        crushing_hammer: [model: 'c5a41eb8d9ccd4c2a79a090e4ab71f92ae679ab6', texture: '23fab9c877f06602768edac3ca69f0289f37878b']
]
tasks.register('validateToolsItemModels') {
    group = 'verification'
    description = 'Verifies complete upstream model parity, provenance, unchanged textures and runtime JAR entries.'
    dependsOn tasks.named('jar')
    inputs.dir('tools/validation/fixtures/engineers_tools_1_1_6')
    inputs.files(restoredToolsItems.keySet().collectMany { itemId -> [
            "src/main/resources/assets/${mod_id}/models/item/${itemId}.json",
            "src/main/resources/assets/${mod_id}/textures/item/${itemId}.png"
    ] })
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })

    doLast {
        def json = new groovy.json.JsonSlurper()
        def gitBlobSha = { byte[] bytes ->
            def digest = java.security.MessageDigest.getInstance('SHA-1')
            digest.update(("blob " + bytes.length).getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(bytes)
            digest.digest().encodeHex().toString()
        }
        def runtimeJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(runtimeJar).withCloseable { archive ->
            restoredToolsItems.each { String itemId, Map pins ->
                def fixture = file("tools/validation/fixtures/engineers_tools_1_1_6/${itemId}.json")
                if (gitBlobSha(fixture.bytes) != pins.model) {
                    throw new GradleException("Pinned upstream model changed: ${itemId}")
                }
                def expectedText = fixture.getText('UTF-8').replace('engineerstools:', "${mod_id}:")
                def expected = json.parseText(expectedText)
                def modelPath = "assets/${mod_id}/models/item/${itemId}.json"
                def texturePath = "assets/${mod_id}/textures/item/${itemId}.png"
                def modelFile = file("src/main/resources/${modelPath}")
                def textureFile = file("src/main/resources/${texturePath}")
                // Full parsed equality covers all geometry, faces, UVs, display contexts and absent keys.
                if (json.parse(modelFile) != expected) {
                    throw new GradleException("Upstream model parity lost: ${itemId}")
                }
                if (!java.util.Arrays.equals(modelFile.bytes, expectedText.getBytes('UTF-8'))) {
                    throw new GradleException("Only the upstream texture namespace may change: ${itemId}")
                }
                if (gitBlobSha(textureFile.bytes) != pins.texture) {
                    throw new GradleException("Original texture bytes changed: ${itemId}")
                }
                [modelPath, texturePath].each { String entryPath ->
                    def entries = java.util.Collections.list(archive.entries()).findAll { it.name == entryPath }
                    if (entries.size() != 1) {
                        throw new GradleException("Expected one runtime JAR entry: ${entryPath}")
                    }
                    byte[] packaged = archive.getInputStream(entries[0]).withCloseable { it.bytes }
                    if (!java.util.Arrays.equals(packaged, file("src/main/resources/${entryPath}").bytes)) {
                        throw new GradleException("Packaged resource differs from validated source: ${entryPath}")
                    }
                }
                logger.lifecycle("TOOLS_MODEL_PARITY_PASS item=${itemId} sourceBlob=${pins.model} textureBlob=${pins.texture} packaged=true")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('validateManualResources')
    dependsOn tasks.named('validateProjectMetadata')
    dependsOn tasks.named('validateSignItemModels')
    dependsOn tasks.named('validateToolsItemModels')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
